# CINEBOOK reverse proxy: the single public entry point (http://localhost).
#   /        -> frontend container (React SPA, with history-API fallback)
#   /api/    -> FastAPI backend container
#   /media/  -> uploaded posters, served directly from the shared volume
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 6m;   # poster uploads (API enforces 5 MB)

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Docker's embedded DNS; re-resolve containers if they restart with a new IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream cinebook_backend {
        zone cinebook_backend 64k;
        server backend:8000 resolve;
        keepalive 16;
    }
    upstream cinebook_frontend {
        zone cinebook_frontend 64k;
        server frontend:80 resolve;
        keepalive 8;
    }

    # Basic abuse protection on authentication endpoints.
    limit_req_zone $binary_remote_addr zone=auth:10m rate=30r/m;

    server {
        listen 80 default_server;
        server_name _;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location ~ ^/api/auth/(login|register|token)$ {
            limit_req zone=auth burst=20 nodelay;
            limit_req_status 429;
            proxy_pass http://cinebook_backend;
            include /etc/nginx/proxy_params.conf;
        }

        location /api/ {
            proxy_pass http://cinebook_backend;
            include /etc/nginx/proxy_params.conf;
        }

        location /media/ {
            alias /var/www/media/;
            expires 7d;
            add_header Cache-Control "public";
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }

        location / {
            proxy_pass http://cinebook_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
